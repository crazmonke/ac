name: Deploy to Cafe24

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install NPM dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deploy artifact
        run: |
          rm -rf .deploy
          mkdir -p .deploy
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "tests" \
            --exclude ".env" \
            --exclude "database/*.sqlite" \
            --exclude "storage/logs/*" \
            ./ .deploy/

      - name: Upload files via SFTP/SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CAFE24_HOST }}
          username: ${{ secrets.CAFE24_USER }}
          key: ${{ secrets.CAFE24_SSH_KEY }}
          port: ${{ secrets.CAFE24_PORT }}
          source: ".deploy/*"
          target: ${{ secrets.CAFE24_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Post-deploy artisan tasks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CAFE24_HOST }}
          username: ${{ secrets.CAFE24_USER }}
          key: ${{ secrets.CAFE24_SSH_KEY }}
          port: ${{ secrets.CAFE24_PORT }}
          script_stop: false
          script: |
            set -e
            cd "${{ secrets.CAFE24_DEPLOY_PATH }}"

            if [ ! -f .env ]; then
              cat > .env <<'EOF'
APP_NAME=Laravel
APP_ENV=production
APP_KEY=${{ secrets.APP_KEY }}
APP_DEBUG=false
APP_URL=${{ secrets.APP_URL }}

LOG_CHANNEL=stack
LOG_LEVEL=error

DB_CONNECTION=mysql
DB_HOST=${{ secrets.CAFE24_DB_HOST }}
DB_PORT=${{ secrets.CAFE24_DB_PORT }}
DB_DATABASE=${{ secrets.CAFE24_DB_NAME }}
DB_USERNAME=${{ secrets.CAFE24_DB_USER }}
DB_PASSWORD=${{ secrets.CAFE24_DB_PASS }}

BROADCAST_CONNECTION=log
FILESYSTEM_DISK=local
QUEUE_CONNECTION=sync
CACHE_STORE=file
SESSION_DRIVER=file
EOF
            fi

            chmod -R ug+rw storage bootstrap/cache || true

            PHP_BIN="${{ secrets.CAFE24_PHP_BIN }}"
            if [ -z "$PHP_BIN" ]; then
              PHP_BIN="php"
            fi

            if [ -f artisan ]; then
              "$PHP_BIN" artisan migrate --force || true
              "$PHP_BIN" artisan optimize:clear || true
              "$PHP_BIN" artisan config:cache || true
              "$PHP_BIN" artisan route:cache || true
              "$PHP_BIN" artisan view:cache || true
            fi
