name: Deploy to Cafe24

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify PHP toolchain
        run: |
          php -v
          composer --version

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install NPM dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deploy artifact
        run: |
          rm -rf .deploy
          mkdir -p .deploy
          rsync -av --delete \
            --exclude ".deploy" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "tests" \
            --exclude ".env" \
            --exclude "database/*.sqlite" \
            --exclude "*.sqlite" \
            --exclude "storage/logs/*" \
            ./ .deploy/

      - name: Configure SSH client
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CAFE24_SSH_KEY }}" | tr -d '\r' > ~/.ssh/cafe24_key
          chmod 600 ~/.ssh/cafe24_key
          ssh-keyscan -4 -p "${{ secrets.CAFE24_PORT }}" "${{ secrets.CAFE24_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files via SSH stream (retry)
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "SSH stream upload attempt $attempt"
            if tar -C .deploy -cf - . | ssh -4 -i ~/.ssh/cafe24_key -o StrictHostKeyChecking=yes \
              -P "${{ secrets.CAFE24_PORT }}" \
              "${{ secrets.CAFE24_USER }}@${{ secrets.CAFE24_HOST }}" \
              'cd ~/www && tar -xf -'; then
              success=1
              break
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "SSH stream upload failed after retries"
            exit 1
          fi

      - name: Remote deploy and artisan tasks
        run: |
          set -euo pipefail
          ssh -4 -i ~/.ssh/cafe24_key -p "${{ secrets.CAFE24_PORT }}" -o StrictHostKeyChecking=yes \
            "${{ secrets.CAFE24_USER }}@${{ secrets.CAFE24_HOST }}" \
            DEPLOY_PATH='${{ secrets.CAFE24_DEPLOY_PATH }}' \
            APP_KEY='${{ secrets.APP_KEY }}' \
            APP_URL='${{ secrets.APP_URL }}' \
            DB_HOST='${{ secrets.CAFE24_DB_HOST }}' \
            DB_PORT='${{ secrets.CAFE24_DB_PORT }}' \
            DB_NAME='${{ secrets.CAFE24_DB_NAME }}' \
            DB_USER='${{ secrets.CAFE24_DB_USER }}' \
            DB_PASS='${{ secrets.CAFE24_DB_PASS }}' \
            PHP_BIN='${{ secrets.CAFE24_PHP_BIN }}' \
            GOOGLE_MAPS_API_KEY='${{ secrets.GOOGLE_MAPS_API_KEY }}' \
            APARTMENT_SYNC_SOURCE_URL='${{ secrets.APARTMENT_SYNC_SOURCE_URL }}' \
            APARTMENT_SYNC_SERVICE_KEY='${{ secrets.APARTMENT_SYNC_SERVICE_KEY }}' \
            ADSENSE_CLIENT_ID='${{ secrets.ADSENSE_CLIENT_ID }}' \
            ADSENSE_HOME_HERO_SLOT='${{ secrets.ADSENSE_HOME_HERO_SLOT }}' \
            ADSENSE_HOME_FEED_SLOT='${{ secrets.ADSENSE_HOME_FEED_SLOT }}' \
            ADSENSE_HOME_FEED_LAYOUT_KEY='${{ secrets.ADSENSE_HOME_FEED_LAYOUT_KEY }}' \
            ADSENSE_HOME_FEED_INTERVAL='${{ secrets.ADSENSE_HOME_FEED_INTERVAL }}' \
            'bash -s' <<'REMOTE'
          set -e

          if [ -n "$DEPLOY_PATH" ] && [ -d "$DEPLOY_PATH" ]; then
            cd "$DEPLOY_PATH"
          elif [ -d "$HOME/www" ]; then
            cd "$HOME/www"
          elif [ -d "www" ]; then
            cd "www"
          else
            echo "Deploy path not found"
            pwd
            ls -la
            exit 1
          fi

          # Prefer the path that actually contains the Laravel app files.
          if [ ! -f artisan ] && [ -d "$HOME/www" ] && [ -f "$HOME/www/artisan" ]; then
            cd "$HOME/www"
          fi

          PREV_ENV=".env.prev"
          if [ -f .env ]; then
            cp .env "$PREV_ENV"
          else
            : > "$PREV_ENV"
          fi

          read_prev_env() {
            local key="$1"
            grep -E "^${key}=" "$PREV_ENV" | tail -n 1 | cut -d '=' -f2-
          }

          {
            echo "APP_NAME=Laravel"
            echo "APP_ENV=production"
            echo "APP_KEY=$APP_KEY"
            echo "APP_DEBUG=false"
            echo "APP_URL=$APP_URL"
            echo
            echo "LOG_CHANNEL=stack"
            echo "LOG_LEVEL=error"
            echo
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_DATABASE=$DB_NAME"
            echo "DB_USERNAME=$DB_USER"
            echo "DB_PASSWORD=$DB_PASS"
            echo
            echo "BROADCAST_CONNECTION=log"
            echo "FILESYSTEM_DISK=local"
            echo "QUEUE_CONNECTION=sync"
            echo "CACHE_STORE=file"
            echo "SESSION_DRIVER=file"
          } > .env

          RESOLVED_GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-$(read_prev_env GOOGLE_MAPS_API_KEY)}"
          RESOLVED_APARTMENT_SYNC_SOURCE_URL="${APARTMENT_SYNC_SOURCE_URL:-$(read_prev_env APARTMENT_SYNC_SOURCE_URL)}"
          RESOLVED_APARTMENT_SYNC_SERVICE_KEY="${APARTMENT_SYNC_SERVICE_KEY:-$(read_prev_env APARTMENT_SYNC_SERVICE_KEY)}"
          RESOLVED_ADSENSE_CLIENT_ID="${ADSENSE_CLIENT_ID:-$(read_prev_env ADSENSE_CLIENT_ID)}"
          RESOLVED_ADSENSE_HOME_HERO_SLOT="${ADSENSE_HOME_HERO_SLOT:-$(read_prev_env ADSENSE_HOME_HERO_SLOT)}"
          RESOLVED_ADSENSE_HOME_FEED_SLOT="${ADSENSE_HOME_FEED_SLOT:-$(read_prev_env ADSENSE_HOME_FEED_SLOT)}"
          RESOLVED_ADSENSE_HOME_FEED_LAYOUT_KEY="${ADSENSE_HOME_FEED_LAYOUT_KEY:-$(read_prev_env ADSENSE_HOME_FEED_LAYOUT_KEY)}"
          RESOLVED_ADSENSE_HOME_FEED_INTERVAL="${ADSENSE_HOME_FEED_INTERVAL:-$(read_prev_env ADSENSE_HOME_FEED_INTERVAL)}"

          if [ -z "$RESOLVED_GOOGLE_MAPS_API_KEY" ]; then
            echo "WARNING: GOOGLE_MAPS_API_KEY is empty after env resolution. Address fallback quality may be reduced until key is configured."
          fi

          if [ -z "$RESOLVED_APARTMENT_SYNC_SERVICE_KEY" ]; then
            echo "WARNING: APARTMENT_SYNC_SERVICE_KEY is empty after env resolution. Gov sync command may fail until key is configured."
          fi

          if [ -n "$RESOLVED_GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY=$RESOLVED_GOOGLE_MAPS_API_KEY" >> .env
          fi

          if [ -n "$RESOLVED_APARTMENT_SYNC_SOURCE_URL" ]; then
            echo "APARTMENT_SYNC_SOURCE_URL=$RESOLVED_APARTMENT_SYNC_SOURCE_URL" >> .env
          fi

          if [ -n "$RESOLVED_APARTMENT_SYNC_SERVICE_KEY" ]; then
            echo "APARTMENT_SYNC_SERVICE_KEY=$RESOLVED_APARTMENT_SYNC_SERVICE_KEY" >> .env
          fi

          if [ -n "$RESOLVED_ADSENSE_CLIENT_ID" ]; then
            echo "ADSENSE_CLIENT_ID=$RESOLVED_ADSENSE_CLIENT_ID" >> .env
          fi

          if [ -n "$RESOLVED_ADSENSE_HOME_HERO_SLOT" ]; then
            echo "ADSENSE_HOME_HERO_SLOT=$RESOLVED_ADSENSE_HOME_HERO_SLOT" >> .env
          fi

          if [ -n "$RESOLVED_ADSENSE_HOME_FEED_SLOT" ]; then
            echo "ADSENSE_HOME_FEED_SLOT=$RESOLVED_ADSENSE_HOME_FEED_SLOT" >> .env
          fi

          if [ -n "$RESOLVED_ADSENSE_HOME_FEED_LAYOUT_KEY" ]; then
            echo "ADSENSE_HOME_FEED_LAYOUT_KEY=$RESOLVED_ADSENSE_HOME_FEED_LAYOUT_KEY" >> .env
          fi

          if [ -n "$RESOLVED_ADSENSE_HOME_FEED_INTERVAL" ]; then
            echo "ADSENSE_HOME_FEED_INTERVAL=$RESOLVED_ADSENSE_HOME_FEED_INTERVAL" >> .env
          fi

          # Cafe24 serves ~/www as docroot, so publish public assets there.
          if [ -d public ]; then
            cp -f public/.htaccess ./.htaccess 2>/dev/null || true
            (cd public && tar -cf - --exclude=index.php .) | tar -xf -
            printf '%s\n' "<?php" "require __DIR__ . '/public/index.php';" > index.php
          fi

          mkdir -p storage bootstrap/cache
          chmod -R ug+rw storage bootstrap/cache

          if [ -z "$PHP_BIN" ]; then
            PHP_BIN="php"
          fi

          if [ -f artisan ]; then
            echo "=== Running database migrations ==="
            "$PHP_BIN" artisan migrate --force || exit 1
            
            echo "=== Clearing caches ==="
            "$PHP_BIN" artisan optimize:clear || true
            
            echo "=== Caching configuration ==="
            "$PHP_BIN" artisan config:cache || true
            
            echo "=== Caching routes ==="
            "$PHP_BIN" artisan route:cache || true
            
            echo "=== Caching views ==="
            "$PHP_BIN" artisan view:cache || true
            
            echo "=== Deployment completed successfully ==="
          fi
          REMOTE

      - name: Post-deploy smoke checks
        env:
          SMOKE_BASE_URL: ${{ secrets.APP_URL }}
        run: ./scripts/smoke-check.sh
