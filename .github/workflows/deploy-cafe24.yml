name: Deploy to Cafe24

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install NPM dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deploy artifact
        run: |
          rm -rf .deploy
          mkdir -p .deploy
          rsync -av --delete \
            --exclude ".deploy" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "vendor" \
            --exclude "tests" \
            --exclude ".env" \
            --exclude "database/*.sqlite" \
            --exclude "*.sqlite" \
            --exclude "storage/logs/*" \
            ./ .deploy/

      - name: Configure SSH client
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CAFE24_SSH_KEY }}" | tr -d '\r' > ~/.ssh/cafe24_key
          chmod 600 ~/.ssh/cafe24_key
          ssh-keyscan -4 -p "${{ secrets.CAFE24_PORT }}" "${{ secrets.CAFE24_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files via SFTP (retry)
        run: |
          set -euo pipefail
          cat > /tmp/sftp_batch.txt <<'SFTP_CMDS'
          cd www
          put -r .deploy/* .
          bye
          SFTP_CMDS

          success=0
          for attempt in 1 2 3; do
            echo "SFTP upload attempt $attempt"
            if sftp -4 -oBatchMode=yes -oStrictHostKeyChecking=yes -i ~/.ssh/cafe24_key \
              -P "${{ secrets.CAFE24_PORT }}" \
              "${{ secrets.CAFE24_USER }}@${{ secrets.CAFE24_HOST }}" < /tmp/sftp_batch.txt; then
              success=1
              break
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "SFTP upload failed after retries"
            exit 1
          fi

      - name: Remote deploy and artisan tasks
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -4 -i ~/.ssh/cafe24_key -p "${{ secrets.CAFE24_PORT }}" -o StrictHostKeyChecking=yes \
            "${{ secrets.CAFE24_USER }}@${{ secrets.CAFE24_HOST }}" \
            DEPLOY_PATH='${{ secrets.CAFE24_DEPLOY_PATH }}' \
            APP_KEY='${{ secrets.APP_KEY }}' \
            APP_URL='${{ secrets.APP_URL }}' \
            DB_HOST='${{ secrets.CAFE24_DB_HOST }}' \
            DB_PORT='${{ secrets.CAFE24_DB_PORT }}' \
            DB_NAME='${{ secrets.CAFE24_DB_NAME }}' \
            DB_USER='${{ secrets.CAFE24_DB_USER }}' \
            DB_PASS='${{ secrets.CAFE24_DB_PASS }}' \
            PHP_BIN='${{ secrets.CAFE24_PHP_BIN }}' \
            'bash -s' <<'REMOTE'
          set -e

          if [ -n "$DEPLOY_PATH" ] && [ -d "$DEPLOY_PATH" ]; then
            cd "$DEPLOY_PATH"
          elif [ -d "$HOME/www" ]; then
            cd "$HOME/www"
          elif [ -d "www" ]; then
            cd "www"
          else
            echo "Deploy path not found"
            pwd
            ls -la
              exit 0
          fi

          if [ ! -f .env ]; then
            {
              echo "APP_NAME=Laravel"
              echo "APP_ENV=production"
              echo "APP_KEY=$APP_KEY"
              echo "APP_DEBUG=false"
              echo "APP_URL=$APP_URL"
              echo
              echo "LOG_CHANNEL=stack"
              echo "LOG_LEVEL=error"
              echo
              echo "DB_CONNECTION=mysql"
              echo "DB_HOST=$DB_HOST"
              echo "DB_PORT=$DB_PORT"
              echo "DB_DATABASE=$DB_NAME"
              echo "DB_USERNAME=$DB_USER"
              echo "DB_PASSWORD=$DB_PASS"
              echo
              echo "BROADCAST_CONNECTION=log"
              echo "FILESYSTEM_DISK=local"
              echo "QUEUE_CONNECTION=sync"
              echo "CACHE_STORE=file"
              echo "SESSION_DRIVER=file"
            } > .env
          fi

          chmod -R ug+rw storage bootstrap/cache || true

          if [ -z "$PHP_BIN" ]; then
            PHP_BIN="php"
          fi

          if [ -f artisan ]; then
            "$PHP_BIN" artisan migrate --force || true
            "$PHP_BIN" artisan optimize:clear || true
            "$PHP_BIN" artisan config:cache || true
            "$PHP_BIN" artisan route:cache || true
            "$PHP_BIN" artisan view:cache || true
          fi
          REMOTE
